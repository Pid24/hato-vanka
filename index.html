<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>In Every Universe I Still Love U Vanka 🐸💕</title>

  <!-- OG Meta Tags -->
  <meta property="og:title"       content="in every universe i still love u, Vanka 💜" />
  <meta property="og:description" content="a tiny gallery of our cutest moments 🐸🌸" />
  <meta property="og:type"        content="website" />
  <meta name="theme-color"        content="#c084fc" />

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
  <!-- Floating particles background -->
  <div class="particle-container" id="particles"></div>

  <!-- ===== HERO ===== -->
  <section class="hero">
    <span class="hero-frog">🐸💕</span>
    <h1 class="hero-title">in every universe<br>i still love u, Vanka 💜</h1>
    <p class="hero-sub">✨ a tiny gallery of our cutest moments ✨</p>
    <a
      href="#gallery"
      class="hero-btn"
      onclick="event.preventDefault(); openLightbox(Math.floor(Math.random() * 20))"
    >lihat foto kita! 📷🌸</a>
    <div
      class="scroll-down"
      onclick="document.getElementById('gallery').scrollIntoView({ behavior: 'smooth' })"
    >💜</div>
  </section>

  <!-- ===== GALLERY ===== -->
  <section class="gallery-section" id="gallery">
    <div class="section-divider"><span>🌸 our polaroid wall 🌸</span></div>
    <div class="polaroid-grid" id="polaroidGrid"></div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <span class="footer-heart">💜</span>
    <p class="footer-text">always &amp; forever, in every universe 🌌</p>
    <p class="footer-sub">made with tons of love 🐸🌸</p>
  </footer>

  <!-- ===== LIGHTBOX ===== -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-inner" id="lightboxInner">
      <div class="tape"></div>
      <button class="lightbox-close" onclick="closeLightboxBtn()">✕</button>
      <button class="lightbox-nav lightbox-prev" onclick="navigate(-1)">‹</button>
      <button class="lightbox-nav lightbox-next" onclick="navigate(1)">›</button>
      <img id="lightboxImg" src="" alt="" />
      <div class="lightbox-caption" id="lightboxCaption"></div>
      <div class="lightbox-bottom-nav" style="display:none">
        <button class="lightbox-nav" onclick="navigate(-1)">‹</button>
        <span class="lightbox-counter" id="lightboxCounter">1 / 20</span>
        <button class="lightbox-nav" onclick="navigate(1)">›</button>
      </div>
    </div>
    <div class="swipe-hint" id="swipeHint">geser kiri / kanan untuk pindah foto 👆</div>
  </div>

  <!-- ===== MUSIC PLAYER ===== -->
  <iframe
    id="yt-player"
    src="https://www.youtube.com/embed/Kp2YwrhFHUI?enablejsapi=1&autoplay=0&loop=1&playlist=Kp2YwrhFHUI&controls=0&rel=0"
    allow="autoplay; encrypted-media"
    frameborder="0"
  ></iframe>

  <button class="music-btn" id="musicBtn" onclick="toggleMusic()" title="play / pause musik">
    🎵
  </button>
  <div class="music-toast" id="musicToast">▶ musik on 🎶</div>

  <!-- Scripts -->
  <script src="index.js"></script>

</body>
</html>
